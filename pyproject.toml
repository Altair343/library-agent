[project]
name = "library-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Altair343", email = "and97_26@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13,<2",
    "fastapi>=0.165.0",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.16.3",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
library-agent = "library_agent:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
strict = true
files = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
